<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Club Socialize — Walk Through</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--gold:#d2b36a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#050806;color:#fff;font-family:Inter,system-ui,sans-serif;font-weight:300}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#cap{position:fixed;left:6vw;bottom:calc(7vh + env(safe-area-inset-bottom,0px));width:min(560px,88vw);text-shadow:0 2px 22px #000a;pointer-events:none;}
#cap.in{animation:ci .45s ease both}@keyframes ci{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#cap small{letter-spacing:.28em;text-transform:uppercase;font-size:11px;color:var(--gold);font-weight:500}
#cap h2{font:italic 500 clamp(34px,6vw,76px)/1.04 'Cormorant Garamond',Georgia,serif;margin:.12em 0 .18em}
#cap p{font-size:clamp(14px,1.5vw,18px);line-height:1.6;margin:0;opacity:.92;max-width:30em}
.cta{display:none;gap:12px;margin-top:22px;flex-wrap:wrap;pointer-events:auto}.cta.on{display:flex}
.cta a{padding:13px 26px;border-radius:99px;font-size:13px;letter-spacing:.08em;text-decoration:none;border:1px solid #fffa;color:#fff}.cta a.p{background:var(--gold);border-color:var(--gold);color:#1a1a12;font-weight:500}
#ui{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;z-index:5;font-size:11px;letter-spacing:.25em;text-transform:uppercase;pointer-events:none;text-shadow:0 1px 10px #0008}
#ui b{font:500 20px 'Cormorant Garamond',serif;letter-spacing:.12em}
#snd,#zb{pointer-events:auto;background:#0003;border:1px solid #fff6;color:#fff;border-radius:99px;padding:7px 14px;font:inherit;font-size:10px;cursor:pointer}
#plan{position:fixed;left:2vw;right:2vw;top:calc(60px + env(safe-area-inset-top,0px));bottom:calc(7vh + 200px);z-index:4;opacity:0;pointer-events:none;display:flex;align-items:center;justify-content:center;cursor:zoom-in}#plan img{max-width:100%;max-height:100%;object-fit:contain;border-radius:14px;border:1px solid #d2b36a66;box-shadow:0 20px 60px #000b}#cap.m h2{font-size:clamp(26px,3.4vw,52px)}
@media(min-width:801px){#plan{left:36vw;right:2vw;top:calc(64px + env(safe-area-inset-top,0px));bottom:3vh}#cap.m{width:min(31vw,460px)}}
@media(max-width:800px){#cap.m p{display:none}#cap.m h2{font-size:26px}#cap.m .cta{margin-top:12px}}
#plan.full{top:0;bottom:0;left:0;right:0;background:#050806f2;z-index:8;cursor:zoom-out;padding:3vw}
#zm{position:fixed;inset:0;z-index:7;background:rgba(5,8,6,.95);display:none;padding:calc(72px + env(safe-area-inset-top,0px)) 6vw 8vw;overflow:auto}#zm.on{display:block}
#zx{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:20px;background:none;border:1px solid #fff6;color:#fff;border-radius:99px;padding:7px 14px;font:inherit;font-size:11px;letter-spacing:.15em;cursor:pointer}
#zl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;max-width:980px;margin:0 auto}
#zl button{display:flex;align-items:center;gap:14px;background:#ffffff0d;border:1px solid #ffffff22;border-radius:14px;color:#fff;padding:14px 16px;font:400 15px Inter,sans-serif;text-align:left;cursor:pointer}
#zl button b{font:italic 500 26px 'Cormorant Garamond',serif;color:var(--gold);min-width:32px}#zl button.cur{border-color:var(--gold);background:#d2b36a24}
#bar{position:fixed;left:0;top:0;height:2px;background:var(--gold);z-index:6;width:0}
#dots{position:fixed;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:5}
#dots i{width:4px;height:4px;border-radius:9px;background:#fff6;transition:.5s}#dots i.on{height:20px;background:var(--gold)}
@media(max-width:600px){#dots{display:none}}
#intro{position:fixed;inset:0;background:#030504;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8vw;z-index:9;transition:opacity 2.4s ease}
#intro blockquote{font:italic 500 clamp(26px,5vw,56px)/1.25 'Cormorant Garamond',Georgia,serif;margin:0;opacity:0;animation:f 3s 1s forwards}
#intro .loc{display:block;font:500 12px Inter,sans-serif;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);margin-bottom:22px}
#intro .sub{font:italic 400 clamp(15px,2vw,21px)/1.5 'Cormorant Garamond',Georgia,serif;color:#fffa;max-width:30em;margin:30px 0 0;opacity:0;animation:f 2s 3.6s forwards}
#intro blockquote{max-width:20em}
#intro button{margin-top:40px;background:none;border:1px solid #fff7;color:#fff;padding:14px 34px;border-radius:99px;letter-spacing:.2em;font-size:12px;text-transform:uppercase;cursor:pointer;opacity:0;animation:f 2s 5.2s forwards;font-family:inherit}
@keyframes f{to{opacity:1}}
</style></head><body>
